<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-gray-700 flex items-center justify-center">

    <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl shadow-2xl w-full max-w-md p-8 text-white">
        <h2 class="text-3xl font-bold mb-6 text-center">Crear Cuenta</h2>

        <form method="POST" class="space-y-5">
            {% csrf_token %}
            {{ form.as_p }}

            <button 
                type="submit" 
                class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 transition-colors duration-200 font-semibold text-white shadow-lg">
                Registrarse
            </button>
        </form>

        <p class="text-center text-sm mt-5 text-gray-300">
            ¿Ya tienes una cuenta?
            <a href="{% url 'login' %}" class="text-indigo-400 hover:text-indigo-300 font-medium">
                Inicia sesión
            </a>
        </p>
    </div>

</body>
</html>
