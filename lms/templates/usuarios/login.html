{% load socialaccount %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-900 via-gray-800 to-gray-700 text-white">

    <div class="w-full max-w-md p-8 rounded-2xl shadow-2xl 
                bg-white/10 backdrop-blur-xl border border-white/20">

        <!-- Título -->
        <h2 class="text-3xl font-bold text-center tracking-wide mb-6">
            Bienvenido de nuevo
        </h2>

        <!-- Mensajes -->
        {% if messages %}
        <ul id="loginMessages" class="space-y-2 mb-5">
            {% for message in messages %}
                <li class="text-sm px-3 py-2 rounded-md 
                           {% if 'error' in message.tags %}
                               bg-red-500/20 text-red-300 border border-red-500/30
                           {% else %}
                               bg-emerald-500/20 text-emerald-300 border border-emerald-500/30
                           {% endif %}
                ">
                    {{ message }}
                </li>
            {% endfor %}
        </ul>
        {% endif %}

        <!-- Formulario -->
        <form method="post" action="{% url 'login' %}" class="space-y-5">
            {% csrf_token %}

            <div>
                <label for="username" class="block text-sm font-medium text-gray-300 mb-1">
                    Usuario
                </label>
                <input 
                    id="username" 
                    name="username" 
                    type="text" 
                    required
                    class="w-full rounded-lg border border-gray-500/40 bg-gray-800/40 
                           px-3 py-2 text-white
                           focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/70 
                           transition"
                    placeholder="Tu nombre de usuario"
                >
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-300 mb-1">
                    Contraseña
                </label>
                <input 
                    id="password" 
                    name="password" 
                    type="password" 
                    required
                    class="w-full rounded-lg border border-gray-500/40 bg-gray-800/40 
                           px-3 py-2 text-white
                           focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/70 
                           transition"
                    placeholder="••••••••"
                >
            </div>

            <div class="flex items-center justify-between pt-2">
                <a href="{% url 'registro' %}" 
                   class="text-sm text-indigo-400 hover:text-indigo-300 hover:underline transition">
                    Crear cuenta
                </a>

                <button 
                    type="submit" 
                    class="bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 
                           transition px-5 py-2.5 rounded-lg font-semibold 
                           shadow-lg shadow-indigo-900/40">
                    Entrar
                </button>
            </div>
        </form>

        <!-- Divider -->
        <div class="mt-7">
            <div class="flex items-center justify-center mb-4">
                <span class="flex-1 border-t border-gray-500/40"></span>
                <span class="px-3 text-gray-400 text-sm">o continúa con</span>
                <span class="flex-1 border-t border-gray-500/40"></span>
            </div>

            <!-- Google -->
            <a href="{% provider_login_url 'google' %}"
                class="flex items-center justify-center gap-3 
                       border border-gray-500/40 rounded-lg py-2.5 
                       bg-white/5 hover:bg-white/10 
                       transition-all shadow-inner">
                
                <img 
                    src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" 
                    alt="Google" 
                    class="w-5 h-5"
                />

                <span class="text-sm font-medium">Iniciar sesión con Google</span>
            </a>
        </div>
    </div>

</body>
</html>
